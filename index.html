<script>

/* ---------- Database (IndexedDB) ---------- */
let db;

let LS=false;const lsr=s=>{try{return JSON.parse(localStorage.getItem('ak_'+s)||'{}')}catch(e){return{}}},lsw=(s,o)=>localStorage.setItem('ak_'+s,JSON.stringify(o));
const all=s=>LS?Promise.resolve(Object.values(lsr(s))):tx(s,'readonly',o=>o.getAll()),put=(s,v)=>LS?new Promise(ok=>{const o=lsr(s);o[v.id]=v;lsw(s,o);ok()}):tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>LS?new Promise(ok=>{const o=lsr(s);delete o[id];lsw(s,o);ok()}):tx(s,'readwrite',o=>o.delete(id));
let N=[],C=[],M={id:'settings',autolock:true},S={v:'home',nid:null,cid:null,tab:'ch',q:''},unl=new Set();

/* ---------- Crypto ---------- */
const enc=new TextEncoder();
const b64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const chk=async(l,pw)=>!!(l&&l.h)&&l.h===await hash(pw||'',ub(l.s),l.it);

const aes=async(pw,salt)=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},await pk(pw),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
async function encJ(o,pw){const s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12));const d=await crypto.subtle.encrypt({name:'AES-GCM',iv:i},await aes(pw,s),enc.encode(JSON.stringify(o)));return JSON.stringify({app:'aksaraku',v:1,s:b64(s),i:b64(i),d:b64(d)})}
async function decJ(j,pw){if(j.app!=='aksaraku')throw 0;return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.i)},await aes(pw,ub(j.s)),ub(j.d))))}

/* ---------- Enkripsi novel terkunci (AES-256-GCM, kunci data dibungkus kata sandi) ---------- */
const rnd=n=>crypto.getRandomValues(new Uint8Array(n)),keys=new Map();
const kek=async(pw,s,it)=>crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:it||150000,hash:'SHA-256'},await pk(pw),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
const dk=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function wrap(raw,pw){const s=rnd(16),i=rnd(12);return{s:b64(s),i:b64(i),it:IT,k:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv:i},await kek(pw,s,IT),raw))}}
const unwrap=async(l,pw)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(l.i)},await kek(pw,ub(l.s),l.it),ub(l.k)));
async function seal(K,o){const i=rnd(12);return{i:b64(i),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv:i},K,enc.encode(JSON.stringify(o))))}}
const unseal=async(K,e)=>JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(e.i)},K,ub(e.d))));
async function saveCh(c){const n=N.find(x=>x.id===c.nid);if(n&&n.lock){const K=keys.get(n.id);if(!K)return;const e=await seal(K,{t:c.t,x:c.x,h:c.h||[]});c.e=e;await put('chapters',{id:c.id,nid:c.nid,o:c.o,u:c.u,w:c.w,bm:c.bm,del:c.del,t:'🔒',x:'',e})}else{const r={...c};delete r.e;delete r._p;await put('chapters',r)}}
async function saveN(n){if(n.lock&&!n.lock.h){const K=keys.get(n.id);if(!K)return;const hd=!!n.hide,ne=await seal(K,{notes:n.notes||'',m:hd?{t:n.t,a:n.a,s:n.s,cv:n.cv}:undefined});n.ne=ne;await put('novels',{...n,...(hd?{t:'Novel terkunci',a:'',s:'',cv:null}:{}),notes:'',ne})}else await put('novels',n)}
async function lockNovel(n,pw){const raw=rnd(32);n.lock=await wrap(raw,pw);keys.set(n.id,await dk(raw));unl.add(n.id);for(const c of C.filter(c=>c.nid===n.id))await saveCh(c);await saveN(n)}
async function tryOpen(n,pw){if(n.lock.h){if(!await chk(n.lock,pw))return false;await lockNovel(n,pw);return true}
 const K=await dk(await unwrap(n.lock,pw));keys.set(n.id,K);for(const c of C.filter(c=>c.nid===n.id))if(c.e){const o=await unseal(K,c.e);c.t=o.t;c.x=o.x;c.h=o.h||[]}
 if(n.ne){const o=await unseal(K,n.ne);n.notes=o.notes;if(o.m)Object.assign(n,o.m)}unl.add(n.id);return true}
/* ---------- Biometrik: adapter (web = WebAuthn terverifikasi; APK = BiometricPrompt via plugin Capacitor) ---------- */
const b64u=b=>b64(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function der2raw(d){d=new Uint8Array(d);let o=2;const rd=()=>{o++;const l=d[o++];let v=d.slice(o,o+l);o+=l;while(v.length>32&&v[0]===0)v=v.slice(1);const x=new Uint8Array(32);x.set(v,32-v.length);return x};const r=rd(),t=rd(),out=new Uint8Array(64);out.set(r);out.set(t,32);return out}
const Bio={
 nat(){const cap=window.Capacitor;return cap&&cap.isNativePlatform&&cap.isNativePlatform()?cap.Plugins&&cap.Plugins.BiometricAuth:null},
 async available(){const n=this.nat();if(n){try{return !!(await n.checkBiometry()).isAvailable}catch(e){return false}}
  try{return !!(window.PublicKeyCredential&&await Promise.race([PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(),new Promise(r=>setTimeout(()=>r(false),1500))]))}catch(e){return false}},

  const ch=ch32(),a=await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:ub(M.bio.id)}],userVerification:'required',timeout:60000}}),r=a.response,cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));

};
